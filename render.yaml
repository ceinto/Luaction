services:
  - type: web
    name: luaction-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && node -e "require('pg'); console.log('pg driver OK', process.version)"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.1
