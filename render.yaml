services:
  - type: web
    name: luaction-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm rebuild better-sqlite3 && node -e "require('better-sqlite3'); console.log('sqlite native OK', process.version)"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.1
