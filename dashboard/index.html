<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luaction — Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0e0f12;
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(99, 102, 241, 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 55%);
        }

        .card {
            width: 360px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 36px 32px;
            backdrop-filter: blur(16px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .logo-sub {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            font-family: 'Inter', monospace;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: rgba(99, 102, 241, 0.5);
        }

        input::placeholder { color: rgba(255,255,255,0.2); }

        button {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 8px;
            padding: 11px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        .error {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            color: #f87171;
            font-size: 13px;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">⚡</div>
        <div>
            <div class="logo-text">Luaction</div>
            <div class="logo-sub">Control Panel</div>
        </div>
    </div>

    <h2>Admin Access</h2>
    <p class="subtitle">Enter your API key to continue</p>

    <label for="apikey">API Key</label>
    <input type="password" id="apikey" placeholder="••••••••••••••••••••••••••••••••" autocomplete="off">

    <button id="loginBtn" onclick="login()">Sign In</button>
    <div class="error" id="errorMsg">Invalid API key. Access denied.</div>
</div>

<script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:3000/api'
        : 'https://luaction-api.onrender.com/api';

    // If already authenticated this session, skip login
    if (sessionStorage.getItem('luaction_key')) {
        window.location.replace('dashboard.html');
    }

    async function login() {
        const key = document.getElementById('apikey').value.trim();
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('errorMsg');

        if (!key) return;

        btn.innerHTML = '<span class="spinner"></span>Verifying...';
        btn.disabled = true;
        err.style.display = 'none';

        try {
            const res = await fetch(`${API}/projects`, {
                headers: { 'X-API-Key': key }
            });

            if (res.ok) {
                sessionStorage.setItem('luaction_key', key);
                window.location.replace('dashboard.html');
            } else {
                throw new Error('invalid');
            }
        } catch {
            err.style.display = 'block';
            btn.innerHTML = 'Sign In';
            btn.disabled = false;
        }
    }

    document.getElementById('apikey').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
